services:
  # Live tracker (tournament day)
  tracker:
    build: .
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_FLASH_MODEL=${GEMINI_FLASH_MODEL:-gemini-3.8-flash}
      - TZ=${TZ:-America/Toronto}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ca-toronto-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - COACH_PIN=${COACH_PIN:-1777}
      - ADMIN_PIN=${ADMIN_PIN:-9876}
      - STREAMS_PAR_URL=${STREAMS_PAR_URL:-}
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./logs:/app/logs
    command: ["--interval", "60", "--storage", "s3", "--skip-push"]
    init: true
    stop_grace_period: 3s
    restart: unless-stopped

  # Step through mock tournament (default: no push, view at localhost:8000)
  #   podman-compose run mock-test                    # local only
  #   podman-compose run mock-test --push             # push to GitHub Pages
  mock-test:
    build: .
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_FLASH_MODEL=${GEMINI_FLASH_MODEL:-gemini-3.8-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TZ=${TZ:-America/Toronto}
      - GIT_AUTHOR_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_AUTHOR_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
      - GIT_COMMITTER_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_COMMITTER_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
    volumes:
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.git-credentials:/root/.git-credentials:ro
      - ./.git:/app/.git
      - ./data:/app/data
      - ./docs:/app/docs
      - ./test:/app/test
      - ./logs:/app/logs
    command: ["--mock-dir", "test/mock_responses", "--once", "--skip-push"]
    profiles: ["test"]

  # Reset mock to step 0 (default: no push)
  #   podman-compose run mock-reset                   # local only
  #   podman-compose run mock-reset --push            # push to GitHub Pages
  mock-reset:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TZ=${TZ:-America/Toronto}
      - GIT_AUTHOR_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_AUTHOR_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
      - GIT_COMMITTER_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_COMMITTER_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
    volumes:
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.git-credentials:/root/.git-credentials:ro
      - ./.git:/app/.git
      - ./data:/app/data
      - ./docs:/app/docs
      - ./test:/app/test
      - ./logs:/app/logs
    command: ["--mock-dir", "test/mock_responses", "--mock-reset", "--once", "--skip-push"]
    profiles: ["test"]

  # Jump to a specific mock step (run with: podman-compose run mock-jump 11)
  #   Resets to clean, then jumps directly to that step.
  mock-jump:
    build: .
    entrypoint: ["sh", "-c", "python3 src/daemon.py --mock-dir test/mock_responses --mock-step $${1:-0} --once --skip-push", "--"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TZ=${TZ:-America/Toronto}
      - GIT_AUTHOR_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_AUTHOR_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
      - GIT_COMMITTER_NAME=${GIT_USER_NAME:-Rangers Tracker Bot}
      - GIT_COMMITTER_EMAIL=${GIT_USER_EMAIL:-tracker@example.com}
    volumes:
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.git-credentials:/root/.git-credentials:ro
      - ./.git:/app/.git
      - ./data:/app/data
      - ./docs:/app/docs
      - ./test:/app/test
      - ./logs:/app/logs
    profiles: ["test"]
